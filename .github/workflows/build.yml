name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk GoiDoiGiong.apk
      - uses: actions/upload-artifact@v4
        with: { name: GoiDoiGiong-apk, path: GoiDoiGiong.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Gọi Đổi Giọng (bản mới nhất)
          files: GoiDoiGiong.apk
          make_latest: true
